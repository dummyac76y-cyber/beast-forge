<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beast Forge — Web</title>
<meta name="description" content="Browser port of the Beast Forge lane-defense strategy game. Kotlin/Compose reimplemented in vanilla JavaScript with a WebGL 3D renderer.">
<meta name="theme-color" content="#0C0A10">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="mark">⚒</span>
      <span class="name">Beast&nbsp;Forge</span>
    </div>
    <nav id="nav">
      <button data-screen="menu" title="Base" class="on"><span class="ni" aria-hidden="true">🏰</span>Base</button>
      <button data-screen="campaign" title="Campaign"><span class="ni" aria-hidden="true">⚔</span>Campaign</button>
      <button data-screen="arena" title="Arena"><span class="ni" aria-hidden="true">∞</span>Arena</button>
      <button data-screen="forge" title="Forge"><span class="ni" aria-hidden="true">⚒</span>Forge</button>
      <button data-screen="armory" title="Armory"><span class="ni" aria-hidden="true">🛡</span>Armory</button>
      <button data-screen="roster" title="Roster"><span class="ni" aria-hidden="true">📜</span>Roster</button>
    </nav>
    <div class="right">
      <span id="chips"></span>
      <button id="soundBtn" title="Toggle sound">🔊</button>
    </div>
  </header>

  <main id="screen"></main>
  <div id="credits" class="wrap"></div>

  <script src="js/models.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/repo.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <!-- Creature rig must load before render.js constructs a Renderer. -->
  <script src="js/beastparts.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <!-- WebGL renderer, kept working behind ?3d but no longer the default.
       Deferred by definition, so it finishes executing before the
       DOMContentLoaded handler in ui.js builds a battle screen. -->
  <script type="module" src="js/render3d.js"></script>
</body>
</html>
